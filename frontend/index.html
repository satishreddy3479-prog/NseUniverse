<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="NSE Universe" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NSE Universe" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>NSE Universe</title>
  </head>
  <body>
    <div id="root">
      <!-- shown until the app has loaded: the brand mark and a loading bar, replaced the moment React mounts -->
      <div role="status" aria-label="Loading NSE Universe" style="display:grid;place-items:center;height:100%;gap:14px;align-content:center;font:500 14px 'Segoe UI',system-ui,sans-serif;color:#42516c">
        <img src="/logo.svg" alt="" width="56" height="56" style="animation:splash-breathe 1.6s ease-in-out infinite" />
        <span>NSE Universe</span>
        <span style="width:120px;height:3px;border-radius:2px;background:#cfd8e6;overflow:hidden"><i style="display:block;width:40%;height:100%;background:#5a3de8;animation:splash-slide 1.1s ease-in-out infinite"></i></span>
      </div>
      <style>
        @keyframes splash-breathe { 0%,100% { opacity:.55; transform:scale(.94) } 50% { opacity:1; transform:scale(1) } }
        @keyframes splash-slide { from { transform:translateX(-100%) } to { transform:translateX(250%) } }
        @media (prefers-reduced-motion: reduce) { #root * { animation: none !important } }
        [data-theme="dark"] #root > div[role="status"] { color:#9aabc4 }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
