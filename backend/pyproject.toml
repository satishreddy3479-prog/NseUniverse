[project]
name = "nse-universe-backend"
version = "0.1.0"
description = "NSE Universe backend: Kotak Neo market data, snapshots, API"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "kotakneoapi>=3.0.13,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: real Kotak Neo calls; run only with NSE_LIVE_TESTS=1 and a configured .env"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"app/prediction/calendar.py" = ["E501"]
"tests/unit/test_user_holidays.py" = ["E501"]
"tests/unit/test_watchdog.py" = ["E501", "S603", "S607"]
"tests/unit/test_session_close.py" = ["E501"]
"tests/unit/test_cleanup.py" = ["E501"]
"tests/unit/test_data_integrity.py" = ["E501"]
"tests/unit/test_strategy_parity.py" = ["E501"]
"tests/unit/test_strategies.py" = ["E501"]
"tests/unit/test_futures_market.py" = ["E501"]
"tests/unit/test_turn_watch.py" = ["E501"]
"tests/unit/test_strategy_cost.py" = ["E501"]
"app/market/futures.py" = ["E501"]
"app/storage/strategies.py" = ["E501"]
"app/servermgmt/*.py" = ["E501"]
"tests/unit/test_servermgmt.py" = ["E501"]
"app/strategy/automation.py" = ["E501"]
"tests/unit/test_strategy_automation.py" = ["E501"]
"tests/unit/test_iv_hv_tools.py" = ["E501"]
"tests/unit/test_index_bars.py" = ["E501"]
"app/prediction/events.py" = ["E501"]
# intraday: formula strings and evidence text read better on one line
"app/intraday/**" = ["E501"]
"app/lifecycle/**" = ["E501"]
# swing: formula-style expressions and rule texts read better on one line
"app/swing/**" = ["E501"]
# intelligence: rule texts and evidence strings read better on one line
"app/intelligence/**" = ["E501"]
"tests/unit/test_intelligence*.py" = ["E501"]
"tests/unit/test_straddle*.py" = ["E501"]
"tests/unit/test_flow_restart.py" = ["E501"]
"tests/unit/test_capabilities_stored.py" = ["E501"]
"tests/unit/test_heavyweights.py" = ["E501"]
"tests/unit/test_mldigest.py" = ["E501"]
"tests/unit/test_implied_vol_solver.py" = ["E501"]
"tests/unit/test_swing_*.py" = ["E501"]
"app/market/futures_series.py" = ["E501"]
"app/prediction/history_service.py" = ["E501"]
"tests/unit/test_futures_series.py" = ["E501"]
"tests/unit/test_price_structure.py" = ["E501"]
"tests/unit/test_intraday_forward.py" = ["E501"]
"tests/unit/test_session_market_time.py" = ["E501"]
"app/domain/session.py" = ["E501"]
"tests/unit/test_volatility.py" = ["E501"]
"tests/unit/test_positioning.py" = ["E501"]
"tests/unit/test_setups_paper.py" = ["E501"]
"tests/unit/test_audit_properties.py" = ["E501"]
"tests/unit/test_labels_evaluate.py" = ["E501"]
"tests/unit/test_observations.py" = ["E501"]
"app/analytics/oi.py" = ["E501"]
"app/market/**" = ["E501"]
"tests/unit/test_market*.py" = ["E501"]
"app/storage/observations.py" = ["E501"]
"tests/unit/test_lifecycle.py" = ["E501"]
"tests/unit/test_intraday_dataset.py" = ["E501"]
"tests/unit/test_intraday.py" = ["E501"]
"tests/unit/test_daily_login.py" = ["E501"]
"app/services/daily_login.py" = ["E501"]
"tests/unit/test_no_intraday_leak.py" = ["E501"]
"tests/unit/test_events_news.py" = ["E501"]
"tests/unit/test_research.py" = ["E501"]
"tests/**" = ["S104", "S105", "S106", "S107", "S311"]
# symbol registry rows and SQL statements read better on one line
"app/prediction/sources/yahoo.py" = ["E501"]
"app/prediction/history_store.py" = ["E501"]
"tests/unit/test_history.py" = ["E501"]
"app/prediction/flows_store.py" = ["E501"]
"app/prediction/flows_service.py" = ["E501"]
"app/prediction/sources/nse.py" = ["E501"]
"tests/unit/test_flows.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["neo_api_client", "neo_api_client.*", "pyotp"]
ignore_missing_imports = true
