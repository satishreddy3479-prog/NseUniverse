[project]
name = "nse-universe-backend"
version = "0.1.0"
description = "NSE Universe backend: Kotak Neo market data, snapshots, API"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "kotakneoapi>=3.0.13,<4",
  "numpy>=1.26,<3",  # the Greeks and What-If engine (app/risk): vectorised Black-76
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "hypothesis>=6.100,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: real Kotak Neo calls; run only with NSE_LIVE_TESTS=1 and a configured .env"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"app/globalmkts/*.py" = ["E501"]
"app/library/*.py" = ["E501"]
"app/api/library_routes.py" = ["E501"]
"tests/unit/test_library*.py" = ["E501"]
"app/forward/*.py" = ["E501"]
"app/market/index_check.py" = ["E501"]
"tests/unit/test_index_check.py" = ["E501"]
